<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>County Population Change Maps</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .landing-app {
      width: min(700px, 100%);
      margin: 0 auto;
      padding: 20px;
    }

    .landing-app h1 {
      margin: 0 0 6px;
      font-size: 22px;
      line-height: 1.4;
      font-weight: 400;
      color: #111;
    }

    .landing-list {
      display: grid;
      gap: 14px;
    }

    .landing-card {
      display: block;
      padding: 16px 18px;
      border: 1px solid #777;
      color: inherit;
      text-decoration: none;
    }

    .landing-card:hover {
      border-color: #111;
    }

    .landing-card:hover .landing-card-title {
      color: var(--blue);
    }

    .landing-card-title {
      font-weight: 700;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <main class="landing-app">
    <h1>County population change maps</h1>

    <div class="landing-list">
      <a class="landing-card" href="main.html">
        <div class="landing-card-title">County population change</div>
      </a>

      <a class="landing-card" href="asian-growth-map.html">
        <div class="landing-card-title">Where Asian population growth led</div>
      </a>

      <a class="landing-card" href="latino-growth-map.html">
        <div class="landing-card-title">Where Latino population growth led</div>
      </a>

      <a class="landing-card" href="natural-growth-map.html">
        <div class="landing-card-title">Where natural change led growth</div>
      </a>

      <a class="landing-card" href="immigration-growth-map.html">
        <div class="landing-card-title">Where immigration led growth</div>
      </a>

      <a class="landing-card" href="natural-vs-immigration-map.html">
        <div class="landing-card-title">Natural change vs. immigration</div>
      </a>

      <a class="landing-card" href="population-trends.html">
        <div class="landing-card-title">County population trends, 2020–2025</div>
      </a>
    </div>
  </main>
</body>
</html>

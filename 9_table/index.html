<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>County Population Change, 2020–2025</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
</head>
<body>
  <main class="county-map-app">

    <div id="loading" class="loading" role="status" aria-live="polite">
      Loading county boundaries and population data…
    </div>

    <div id="error" class="error" hidden></div>

    <section id="visualization" class="visualization" hidden>
      <aside class="left-panel">

        <section class="controls" aria-label="Map controls">
  

      <div class="control-group population-chart-group">
        <div class="control-label">Population</div>
        <div class="population-chart-wrap">
          <svg
            id="population-chart"
            viewBox="0 0 280 210"
            role="img"
            aria-label="Percent population change by race and ethnicity for the United States"
          ></svg>
          <div id="population-chart-tooltip" class="population-chart-tooltip" aria-hidden="true"></div>
        </div>
        <div id="population-chart-key" class="population-chart-key" aria-label="Population groups"></div>
      </div>

      <div class="control-group">
        <div class="control-label">Measure</div>
        <div class="button-row" id="metric-controls">
          <button type="button" class="is-active" data-value="count">Count change</button>
          <button type="button" data-value="percent">Percent change</button>
        </div>
      </div>

      <div class="control-group">
        <div class="control-label">Years</div>
        <div class="year-controls">
          <label for="start-year">
            <span>Comparing</span>
            <select id="start-year" aria-label="Start year"></select>
          </label>

          <label for="end-year">
            <span>to</span>
            <select id="end-year" aria-label="End year"></select>
          </label>
        </div>
      </div>
       
        </section>

       
      </aside>

      <div class="map-column">
    <header class="map-header">
      <h1>County population change, 2020–2025</h1>
    </header>
     <section class="state-selector">
        <label class="state-select-label" for="state-select">
          <span class="control-label">Select a state</span>
          <select id="state-select" aria-label="Select a state">
            <option value="">All states</option>
          </select>
        </label>

        <label class="state-select-label" for="region-select">
          <span class="control-label">Select a region</span>
          <select id="region-select" aria-label="Select a region">
            <option value="">All regions</option>
          </select>
        </label>
        </section>
    <div class="legend-row">
      <div class="legend-filter">
        <div id="legend-label" class="legend-label"></div>
        <div class="legend-slider-wrap">
          <div id="legend-gradient" class="legend-gradient"></div>
          <input id="legend-lower" class="legend-range legend-range-lower" type="range" aria-label="Lower change bound">
          <input id="legend-upper" class="legend-range legend-range-upper" type="range" aria-label="Upper change bound">
        </div>
        <div class="legend-values">
          <span id="legend-min"></span>
          <span>0</span>
          <span id="legend-max"></span>
        </div>
        <div class="legend-selected-values">
          <span>Lower: <strong id="legend-lower-value"></strong></span>
          <span>Upper: <strong id="legend-upper-value"></strong></span>
        </div>
      </div>
    </div>
        <div class="map-wrap">
          <svg
            id="county-map"
            viewBox="0 0 975 610"
            role="img"
            aria-label="Interactive map of county population change"
          ></svg>
          <div id="tooltip" class="tooltip" aria-hidden="true"></div>
        </div>


        <div id="status" class="status" aria-live="polite"></div>

        <section class="county-table-section" aria-labelledby="county-table-title">
          <div class="county-table-heading">
            <h2 id="county-table-title">Filtered counties</h2>
            <div id="county-table-summary" class="county-table-summary"></div>
          </div>
          <div class="county-table-wrap">
            <table class="county-table">
              <thead>
                <tr>
                  <th scope="col">County</th>
                  <th scope="col">State</th>
                  <th scope="col">County type</th>
                  <th scope="col" id="county-table-start-year">Start</th>
                  <th scope="col" id="county-table-end-year">End</th>
                  <th scope="col">Count change</th>
                  <th scope="col">Percent change</th>
                </tr>
              </thead>
              <tbody id="county-table-body"></tbody>
            </table>
          </div>
        </section>
      </div>

    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>

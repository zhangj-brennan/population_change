<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Natural Change vs. Immigration by County, 2020–2025</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <style>
    .map-header h1 {
      font-size: 20px;
      line-height: 1.4;
      font-weight: 400;
      margin: 0 0 6px;
    }

    .growth-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 20px;
      margin: 14px 0 0;
      font-size: 12px;
      color: var(--muted);
    }

    .growth-legend-item {
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }

    .growth-legend-swatch {
      width: 12px;
      height: 12px;
      flex: none;
      border: 1px solid rgba(0, 0, 0, 0.15);
    }

    .growth-legend-scale {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .growth-legend-gradient {
      width: 120px;
      height: 12px;
      border: 1px solid #aaa;
    }

    .growth-legend-edge {
      white-space: nowrap;
    }

    .geo-controls-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
      position: relative;
      z-index: 11;
      max-width: 720px;
    }

    .geo-controls-row .state-select-label {
      flex: 1 1 160px;
    }

    .geo-controls-row .county-search-label {
      flex: 1.4 1 220px;
    }

    .factor-table-section {
      margin-top: 28px;
    }

    .factor-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 8px;
    }

    .factor-tab {
      padding: 4px 10px;
      border: 1px solid #777;
      border-radius: 0;
      color: #111;
      background: #fff;
      font: inherit;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
    }

    .factor-tab:hover {
      border-color: #111;
    }

    .factor-tab[aria-selected="true"] {
      border-color: #111;
      color: #fff;
      background: #111;
    }

    .factor-tab-count {
      font-weight: 400;
    }

    .factor-table-wrap {
      max-height: 480px;
      overflow-y: auto;
    }

    /* Base .county-table styles assume three text columns; this one has two. */
    .factor-table th:nth-child(3),
    .factor-table td:nth-child(3) {
      min-width: 0;
      max-width: none;
      white-space: nowrap;
      text-align: right;
    }

    .factor-table th:nth-child(n + 3) .sort-button {
      justify-content: flex-end;
    }

  </style>
</head>
<body>
  <main class="county-map-app">
    <div id="loading" class="loading" role="status" aria-live="polite">
      Loading county boundaries and population data…
    </div>

    <div id="error" class="error" hidden></div>

    <section id="visualization" class="visualization" hidden>
      <div class="map-column">
        <header class="map-header">
          <h1>
            Natural change vs. immigration as the bigger factor in county growth, over the
            <span class="inline-select-wrap">
              <select id="period-select" class="inline-select" aria-label="Time period">
                <option value="cumulative">2020–2025 period</option>
                <option value="annual">most recent year (2024–2025)</option>
              </select>
              <span class="inline-select-arrow" aria-hidden="true">▾</span>
            </span>
          </h1>
          <p id="status-text" aria-live="polite"></p>
        </header>

        <div class="geo-controls-row">
          <label class="county-search-label" for="county-search-input">
            <span class="control-label">Search for a county</span>
            <div class="county-search-input-wrap">
              <input
                type="text"
                id="county-search-input"
                class="county-search-input"
                placeholder="e.g. Cook County, Illinois"
                autocomplete="off"
                spellcheck="false"
                role="combobox"
                aria-expanded="false"
                aria-controls="county-search-suggestions"
                aria-autocomplete="list"
              >
              <button type="button" id="county-search-clear" class="county-search-clear" hidden aria-label="Clear county search">&times;</button>
              <ul id="county-search-suggestions" class="county-search-suggestions" role="listbox" hidden></ul>
            </div>
          </label>
          <label class="state-select-label" for="state-select">
            <span class="control-label">Select a state</span>
            <select id="state-select" aria-label="Select a state">
              <option value="">All states</option>
            </select>
          </label>

          <label class="state-select-label" for="region-select">
            <span class="control-label">Select a region</span>
            <select id="region-select" aria-label="Select a region">
              <option value="">All regions</option>
            </select>
          </label>
        </div>

        <div class="map-wrap">
          <svg
            id="county-map"
            viewBox="0 0 975 610"
            role="img"
            aria-label="Map of counties comparing natural change to immigration as the larger factor of population growth"
          ></svg>
          <div id="tooltip" class="tooltip" aria-hidden="true">
            <button type="button" id="tooltip-close" class="tooltip-close" aria-label="Close">&times;</button>
            <div id="tooltip-content"></div>
          </div>
        </div>

        <div class="growth-legend">
          <span class="growth-legend-item">
            <span class="growth-legend-scale">
              Natural change
              <span id="growth-legend-gradient-a" class="growth-legend-gradient"></span>
              <span id="growth-legend-max-a" class="growth-legend-edge"></span>
            </span>
          </span>
          <span class="growth-legend-item">
            <span class="growth-legend-scale">
              Immigration
              <span id="growth-legend-gradient-b" class="growth-legend-gradient"></span>
              <span id="growth-legend-max-b" class="growth-legend-edge"></span>
            </span>
          </span>
          <span class="growth-legend-item">
            <span class="growth-legend-swatch" style="background:#ededed;"></span>
            Neither factor grew the county
          </span>
        </div>

        <section class="factor-table-section" aria-label="Counties by leading factor">
          <div class="factor-tabs" role="tablist" aria-label="Leading factor">
            <button type="button" role="tab" class="factor-tab" data-tab="a" aria-selected="true" aria-controls="factor-table-wrap">
              Natural change led <span class="factor-tab-count" data-count="a"></span>
            </button>
            <button type="button" role="tab" class="factor-tab" data-tab="b" aria-selected="false" aria-controls="factor-table-wrap">
              Immigration led <span class="factor-tab-count" data-count="b"></span>
            </button>
            <button type="button" role="tab" class="factor-tab" data-tab="neither" aria-selected="false" aria-controls="factor-table-wrap">
              Neither grew <span class="factor-tab-count" data-count="neither"></span>
            </button>
          </div>

          <div class="county-table-wrap factor-table-wrap" id="factor-table-wrap" role="tabpanel">
            <table class="county-table factor-table">
              <thead>
                <tr>
                  <th scope="col" aria-sort="none">
                    <button type="button" class="sort-button" data-sort-key="county">County<span class="sort-arrow" aria-hidden="true"></span></button>
                  </th>
                  <th scope="col" aria-sort="none">
                    <button type="button" class="sort-button" data-sort-key="state">State<span class="sort-arrow" aria-hidden="true"></span></button>
                  </th>
                  <th scope="col" aria-sort="none">
                    <button type="button" class="sort-button" data-sort-key="a">Natural change<span class="sort-arrow" aria-hidden="true"></span></button>
                  </th>
                  <th scope="col" aria-sort="none">
                    <button type="button" class="sort-button" data-sort-key="b">Immigration<span class="sort-arrow" aria-hidden="true"></span></button>
                  </th>
                  <th scope="col" aria-sort="none">
                    <button type="button" class="sort-button" data-sort-key="total">Total change<span class="sort-arrow" aria-hidden="true"></span></button>
                  </th>
                </tr>
              </thead>
              <tbody id="factor-table-body"></tbody>
            </table>
          </div>
        </section>

      </div>
    </section>
  </main>

  <script src="county-search.js"></script>
  <script src="components-map.js"></script>
  <script>
    renderTwoFactorMap({
      factorAKey: "natural",
      factorALabel: "natural change",
      factorAColor: "#FFCF01",
      factorBKey: "international",
      factorBLabel: "immigration",
      factorBColor: "#711471"
    });
  </script>
</body>
</html>
